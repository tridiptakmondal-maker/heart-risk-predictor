<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessment Result</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .result-card { max-width: 500px; width: 100%; border-radius: 20px; text-align: center; background: white; padding: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .prediction-text { font-size: 1.5rem; font-weight: bold; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="result-card">
        <h3>Assessment Result</h3>
        <div class="alert alert-{{ alert_class }} prediction-text">
            {{ prediction_text }}
        </div>
        <p class="text-muted small">Note: This is an AI prediction based on historical data. Always consult a medical professional for actual diagnosis.</p>
        <a href="/" class="btn btn-outline-secondary mt-3">Try Another Patient</a>
    </div>
</body>
</html>
